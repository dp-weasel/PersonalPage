<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weasel Shiro</title>
  <meta name="description" content="Mensajes de Guild Wars 2 listos para copiar con un clic.">
  <meta name="color-scheme" content="dark light">
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo.
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro">
    <span aria-hidden="true" class="icon-sun">☀</span>
    <span aria-hidden="true" class="icon-moon">☾</span>
  </button>

  <header class="hero">
    <div class="stoat-badge" role="img" aria-label="Armiño blanco">
      <div class="stoat" aria-hidden="true">
        <span class="tail"></span>
        <span class="body"></span>
        <span class="leg back"></span>
        <span class="leg front"></span>
        <span class="neck"></span>
        <span class="head"></span>
        <span class="snout"></span>
        <span class="ear"></span>
        <span class="eye"></span>
        <span class="nose"></span>
      </div>
    </div>
    <h1>Weasel Shiro</h1>
    <p class="subtitle">Haz clic en un mensaje para copiarlo y pégalo en el chat de GW2.</p>
  </header>

  <main>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Categorías"></nav>
    <section id="panels"></section>
    <div id="status" class="status" hidden>
      <p id="status-text"></p>
      <label id="file-picker" class="file-picker" hidden>
        Elegir messages.json
        <input id="file-input" type="file" accept=".json,application/json">
      </label>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
